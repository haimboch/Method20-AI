name: METHOD 20 Morning Email
on:
  workflow_dispatch:
  schedule:
    # Repeated UTC checks support both Israeli DST seasons.
    # Morning gate and delivery cache suppress all non-eligible/duplicate runs.
    # GitHub Actions scheduled runs can be delayed or omitted under load.
    - cron: "07,27,47 3-7 * * 1-6"

permissions:
  contents: read
  actions: read

concurrency:
  group: method20-morning-email
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Verify mail rules
        run: python -m unittest discover -s tests -v
      - name: Determine delivery session
        id: gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python morning_gate.py
      - name: Check whether today's report was already delivered
        id: previous
        if: github.event_name == 'schedule' && steps.gate.outputs.should_run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .method20-delivery-marker
          key: method20-delivered-${{ steps.gate.outputs.session_date }}
      - name: Send verified EOD report by Gmail SMTP
        if: steps.gate.outputs.should_run == 'true' && (github.event_name != 'schedule' || steps.previous.outputs.cache-hit != 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python mail_report.py
          echo "${{ steps.gate.outputs.session_date }}" > .method20-delivery-marker
      - name: Mark scheduled report as delivered
        if: github.event_name == 'schedule' && steps.gate.outputs.should_run == 'true' && steps.previous.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .method20-delivery-marker
          key: method20-delivered-${{ steps.gate.outputs.session_date }}
      - name: Already delivered
        if: steps.previous.outputs.cache-hit == 'true'
        run: echo "DUPLICATE_PREVENTED report already mailed for this NYSE session"
