name: METHOD 20 EOD Report
on:
  workflow_dispatch:
  schedule:
    # UTC schedules covering Israeli winter/summer time.
    # Only the local 23:30–00:29 Israel window passes the guard.
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
    # Backup EOD opportunities after local midnight if earlier cron was dropped.
    - cron: "10 21 * * 1-5"
    - cron: "10 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: method20-state-write
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Check Israel clock and NYSE calendar
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python schedule_guard.py
      - name: Verify METHOD20 rules
        if: steps.guard.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Generate actual-data HTML report
        if: steps.guard.outputs.should_run == 'true'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          EXPECTED_SESSION_DATE: ${{ github.event_name == 'schedule' && steps.guard.outputs.session_date || '' }}
        run: python engine.py
      - name: Persist locked zones for the next session
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "method20-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/market_zones.json
          git diff --cached --quiet || (git commit -m "Update locked METHOD20 market zones" && git push origin HEAD:${{ github.ref_name }})
      - name: Upload report
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: method20-html-report
          path: output/
          if-no-files-found: error
          retention-days: 30
