name: METHOD 20 EOD Report
on:
  workflow_dispatch:
  schedule:
    # UTC schedules covering Israeli winter/summer time.
    # Only the local 23:30–00:29 Israel window passes the guard.
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
    # Backup EOD opportunities after local midnight if earlier cron was dropped.
    - cron: "10 21 * * 1-5"
    - cron: "10 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: method20-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Check Israel clock and NYSE calendar
        id: guard
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python schedule_guard.py
      - name: Verify chart-only report tests
        if: steps.guard.outputs.should_run == 'true'
        run: python -m unittest discover -s tests -v
      - name: Generate actual-data HTML report
        if: steps.guard.outputs.should_run == 'true'
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          EXPECTED_SESSION_DATE: ${{ github.event_name == 'schedule' && steps.guard.outputs.session_date || '' }}
        run: python engine.py
      - name: Upload report
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: method20-html-report
          path: output/
          if-no-files-found: error
          retention-days: 30

  publish_dashboard:
    needs: report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified chart dashboard
        uses: actions/download-artifact@v4
        with:
          name: method20-html-report
          path: site
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
